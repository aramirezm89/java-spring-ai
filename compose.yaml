services:
  postgres:
    image: postgres:15.3
    container_name: medassistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medassistant
      POSTGRES_USER: medassistant
      POSTGRES_PASSWORD: medassistant
    ports:
      - "5432:5432"
    volumes:
      - medassistant-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medassistant -d medassistant"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medassistant-pgdata:
